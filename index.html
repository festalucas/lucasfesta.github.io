<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecniquita - Sistema de Taller</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

   <div class="encabezado">

    <img src="img/logo.png" class="logo">

   

</div>

    <div class="menu">

        <button onclick="mostrarSeccion('ingreso')">
            Nuevo Ingreso
        </button>

        <button onclick="mostrarSeccion('reparaciones')">
            Reparaciones
        </button>

        <button onclick="mostrarSeccion('clientes')">
            Clientes
        </button>

        <button onclick="mostrarSeccion('economia')">
            Economía
        </button>

    </div>

    <div id="contenido">

        <div id="ingreso" class="seccion">

    <h2>Nueva Orden de Trabajo</h2>

    <p id="numeroOrden"></p>

    <label>Cliente</label>
    <input
    type="text"
    id="cliente"
    oninput="buscarCliente()"
>

<div id="sugerenciasCliente"></div> 

    <label>Teléfono</label>
    <input type="text" id="telefono">

    <label>Dirección</label>
    <input type="text" id="direccion">

    <label>Producto</label>
    <input type="text" id="producto">

    <label>Marca</label>
    <input type="text" id="marca">

    <label>Modelo</label>
    <input type="text" id="modelo">

    <label>Número de Serie</label>
    <input type="text" id="serie">

    <label>Falla Informada</label>
    <textarea id="falla"></textarea>

    <label>Observaciones Físicas</label>
    <textarea id="observaciones"></textarea>

    <label>Accesorios</label>
    <input type="text" id="accesorios">

    <label>Ubicación en Taller</label>
    <input type="text" id="ubicacion">

    <label>Foto 1</label>
    <input type="file">

    <label>Foto 2</label>
    <input type="file">

    <label>Foto 3</label>
    <input type="file">

    <button onclick="generarOrden()">
        Generar Orden
    </button>

    <hr>

    <div id="resultadoOrden"></div> 

    </div>


    <div id="reparaciones" class="seccion">

    <h2>Listado de Reparaciones</h2>

    <input
    type="text"
    id="busquedaReparacion"
    placeholder="Buscar por OT, cliente o producto..."
    onkeyup="actualizarTablaReparaciones()"
    >
    
    <div class="barraFiltros">

        <label>Estado:</label>

        <select
            id="filtroEstado"
            onchange="actualizarTablaReparaciones()"
        >
            <option>Todos</option>
            <option>Ingresado</option>
            <option>Diagnosticando</option>
            <option>Esperando aprobación</option>
            <option>Esperando repuesto</option>
            <option>En reparación</option>
            <option>Reparado</option>
            <option>Entregado</option>
        </select>

    </div>

    <table id="tablaReparaciones">

<div id="reparaciones" class="seccion">

    <h2>Listado de Reparaciones</h2>

    <div class="barraFiltros">

        <label>Estado:</label>

        <select
            id="filtroEstado"
            onchange="actualizarTablaReparaciones()"
        >
            <option>Todos</option>
            <option>Ingresado</option>
            <option>Diagnosticando</option>
            <option>Esperando aprobación</option>
            <option>Esperando repuesto</option>
            <option>En reparación</option>
            <option>Reparado</option>
            <option>Entregado</option>
        </select>

    </div>

    <table id="tablaReparaciones">

        <thead>
            <tr>
                <th>OT</th>
                <th>Cliente</th>
                <th>Producto</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody>
        </tbody>

    </table>

</div>
<div id="detalleOrden" class="seccion">

    <h2>Detalle de Orden</h2>

    <div id="contenidoDetalle">

    </div>

</div>
     

   <div id="clientes" class="seccion">

    <h2>Clientes</h2>

    <table id="tablaClientes">

        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

        </tbody>

    </table>



</div>     

       <div id="economia" class="seccion">

    <h2>Economía y Backups</h2>
    <h3>Resumen General</h3>

<div id="resumenEconomico"></div>

<hr>

<h3>Estados de Reparación</h3>

<div id="resumenEstados"></div>

<hr>

<h3>Ticket Promedio</h3>

<div id="ticketPromedio"></div>

<hr>

<h3>Desglose Mensual</h3>

<div id="desgloseMensual"></div>

<hr>

    <button onclick="exportarDatos()">
        💾 Exportar Datos
    </button>

    <br><br>

    <input
        type="file"
        id="archivoImportacion"
        accept=".json"
    >

    <button onclick="importarDatos()">
        📂 Importar Datos
    </button>

</div>

    </div>
    
    <div id="detalleCliente" class="seccion">

    <h2>Editar Cliente</h2>

    <div id="contenidoCliente"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="script.js"></script>



</body>
</html>
